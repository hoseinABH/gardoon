spring:
  application:
    name: gardoon-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:./.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/gardoon_db}
    username: ${SPRING_DATASOURCE_USERNAME:gardoon_user}
    password: ${SPRING_DATASOURCE_PASSWORD:gardoon_secret_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MIN_IDLE:2}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${APP_JWT_SECRET:}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000} # 24 hours
    refresh-expiration-ms: ${APP_JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
  auth:
    dev-mode: ${APP_AUTH_DEV_MODE:true}
  sms:
    provider: ${APP_SMS_PROVIDER:mock}
    api-key: ${APP_SMS_API_KEY:}
    template-id: ${APP_SMS_TEMPLATE_ID:0}
    param-name: ${APP_SMS_PARAM_NAME:Code}
    line-number: ${APP_SMS_LINE_NUMBER:0}
    base-url: ${APP_SMS_BASE_URL:https://api.sms.ir/v1}
  storage:
    upload-dir: ${APP_STORAGE_UPLOAD_DIR:./uploads/receipts}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://192.168.*:3000,https://*}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
